version: 2

models:
  - name: contract_amendments
    description: >-
      Per-contract amendment red flags (PR-D-05, O2): value amendment
      (valorAcumulado > valorInicial) and term extension (vigencia fim
      estendida), computed from the bronze observation sequence.
      Real-data invariants P6-P8 are enforced by the singular tests in
      dbt/tests/contract_amendments_*.sql.
    columns:
      - name: contract_id
        description: Silver contract identifier (one row per contract)
        tests:
          - not_null
          - unique
      - name: bronze_matched
        description: Whether any bronze observation matched the contract
        tests:
          - not_null

  - name: amendments_by_supplier
    description: Amendment red flags aggregated by supplier
    columns:
      - name: supplier_id
        description: Supplier identifier (CNPJ or CPF)
        tests:
          - not_null
          - unique

  - name: amendments_by_agency
    description: Amendment red flags aggregated by buying agency
    columns:
      - name: siafi_code
        description: SIAFI code of the buying agency
        tests:
          - not_null
          - unique

  - name: contract_red_flags
    description: >-
      Per-contract red flags and deterministic CRI (Fazekas & Kocsis,
      PR-D-04); flags are 1/0/NULL, CRI is the mean of the non-null
      flags. Real-data invariants P6-P8 are enforced by the singular
      tests in dbt/tests/contract_red_flags_*.sql.
    columns:
      - name: contract_id
        description: Silver contract identifier (one row per contract)
        tests:
          - not_null
          - unique
      - name: bronze_matched
        description: Whether a bronze PNCP payload matched the contract
        tests:
          - not_null

  - name: red_flags_by_supplier
    description: Red flags and CRI aggregated by supplier
    columns:
      - name: supplier_id
        description: Supplier identifier (CNPJ or CPF)
        tests:
          - not_null
          - unique

  - name: red_flags_by_agency
    description: Red flags and CRI aggregated by buying agency
    columns:
      - name: siafi_code
        description: SIAFI code of the buying agency
        tests:
          - not_null
          - unique

  - name: contracts_by_agency
    description: Contracts aggregated by buying agency
    columns:
      - name: siafi_code
        description: SIAFI code of the buying agency
        tests:
          - not_null
          # A SIAFI code identifies a single agency; a duplicate means the
          # same code arrived with inconsistent name/level/UF attributes.
          - unique
      - name: contracts
        tests:
          - not_null

  - name: contracts_daily
    description: Daily contract load volumes and amounts
    columns:
      - name: dt
        description: Ingestion date partition
        tests:
          - not_null
          - unique

  - name: data_quality_daily
    description: Daily data quality indicators of the silver contracts
    columns:
      - name: dt
        description: Ingestion date partition
        tests:
          - not_null
          - unique

  - name: supplier_stats
    description: Contract history aggregated by supplier
    columns:
      - name: supplier_id
        description: Supplier identifier (CNPJ or CPF)
        tests:
          - not_null
          - unique

  - name: pod_usage_hourly
    description: Hourly per-pod CPU/memory usage of the platform namespace
    columns:
      - name: hour
        description: Hour bucket of the usage samples
        tests:
          - not_null
      - name: pod
        description: Pod name
        tests:
          - not_null

  - name: platform_cost_daily
    description: Daily real usage vs declared requests per pod (idleness)
    columns:
      - name: dt
        description: Usage date
        tests:
          - not_null
      - name: pod
        description: Pod name
        tests:
          - not_null

  - name: political_connections
    description: >-
      Publishable view of the political_connection signals (O8, PR-D-08):
      campaign donors of elected mayors who became suppliers of the
      municipality inside the mandate window. LGPD: donor CPFs are masked
      CEAF-style (donor_document_masked); the stable key is the SHA-256
      signal_id, never the full document. Real-data invariants are
      enforced by the singular tests in dbt/tests/political_connections_*.sql.
    columns:
      - name: signal_id
        description: >-
          SHA-256 of (election_year, candidate sequential, full donor
          document) — stable editorial key, matches the triage key without
          exposing the document
        tests:
          - not_null
          - unique
      - name: donor_document_masked
        description: >-
          Donor document with CPFs masked CEAF-style (***123456**); CNPJs
          (public company data) are kept complete
        tests:
          - not_null
      - name: donor_document_type
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['PF', 'PJ']
      - name: share
        description: Supplier share of the buyer's contracted value in the
          mandate window
        tests:
          - not_null
      - name: score
        tests:
          - not_null
