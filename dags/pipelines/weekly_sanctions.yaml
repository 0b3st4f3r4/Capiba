# Weekly collection of the CEIS/CNEP/CEAF sanction lists of the Portal da
# Transparência (empresas inidôneas/suspensas, empresas punidas e expulsões
# da administração federal). The lists are full snapshots (no temporal
# window): raw payloads land in the bronze raw_ceis/raw_cnep/raw_ceaf tables
# and the normalized records in the silver `sanctions` table — input of the
# `sanctioned_supplier` signal (PR-D-06, exact document match) and of the
# fuzzy `sanctioned_name_match` signal (PR-D-06b; the CEAF CPF is masked at
# the source, so it only enters the fuzzy path). Requires
# TRANSPARENCY_API_KEY.
name: weekly_sanctions
description: Weekly collection of the CEIS/CNEP/CEAF sanction lists (Portal da Transparência)
schedule: "22 3 * * 2" # Tuesdays 03:22 UTC — off-peak
window: all # full snapshot; the window is ignored by the sources
sources:
  - name: ceis
  - name: cnep
  - name: ceaf
formula: entities_collect
destinations:
  - lake_bronze # raw audit copy + raw_ceis/raw_cnep Iceberg tables
  - lake_silver # silver sanctions table (writes in the normalize tasks)
  - gold_report # run report in the gold bucket
