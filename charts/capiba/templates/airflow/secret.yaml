{{- if .Values.airflow.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capiba.airflow.fullname" . }}-auth
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "airflow" "context" .) | nindent 4 }}
type: Opaque
stringData:
  AIRFLOW__CORE__FERNET_KEY: {{ include "capiba.airflow.fernetKey" . | quote }}
  # Pinned JWT secret: UI sessions and API tokens survive pod restarts
  AIRFLOW__API_AUTH__JWT_SECRET: {{ .Values.airflow.auth.jwtSecret | quote }}
  # OAuth client (Keycloak, client "airflow") consumed by webserver_config.py
  AIRFLOW_OAUTH_CLIENT_SECRET: {{ index .Values.keycloak.clientSecrets "airflow" | quote }}
  # Remote-log S3 connection as an env var: env connections resolve in every
  # process (api-server, scheduler, task SDK) without hitting the metadata
  # DB — DB-defined connections are NOT resolved by the api-server's log
  # reader in Airflow 3 (botocore NoCredentialsError).
  AIRFLOW_CONN_MINIO_LOGS: {{ printf "aws://%s:%s@/?endpoint_url=%s" .Values.minio.scopedUsers.airflowLogs.accessKey .Values.minio.scopedUsers.airflowLogs.secretKey (printf "http://%s:%v" (include "capiba.minio.fullname" .) .Values.minio.service.apiPort | urlquery) | quote }}
{{- end }}
