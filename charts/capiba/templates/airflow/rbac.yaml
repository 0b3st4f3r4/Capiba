{{- if .Values.airflow.enabled }}
# Dedicated ServiceAccount for the Airflow pod. The Role grants read access
# to the metrics-server API (metrics.k8s.io pods) so the hourly_pod_usage
# pipeline can collect the platform resource usage in-cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "capiba.airflow.fullname" . }}
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "airflow" "context" .) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "capiba.airflow.fullname" . }}-metrics-reader
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "airflow" "context" .) | nindent 4 }}
rules:
  - apiGroups:
      - metrics.k8s.io
    resources:
      - pods
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "capiba.airflow.fullname" . }}-metrics-reader
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "airflow" "context" .) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "capiba.airflow.fullname" . }}-metrics-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "capiba.airflow.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
