{{- if .Values.airflow.enabled }}
# webserver_config.py of the FAB auth manager: OAuth via Keycloak (SSO).
# Mounted at /opt/airflow/webserver_config.py in the api-server container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "capiba.airflow.fullname" . }}-webserver-config
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "airflow" "context" .) | nindent 4 }}
data:
  webserver_config.py: |
    """FAB auth manager configuration: OAuth via Keycloak (SSO, realm capiba)."""

    import os

    from flask_appbuilder.security.manager import AUTH_OAUTH

    AUTH_TYPE = AUTH_OAUTH
    AUTH_USER_REGISTRATION = True
    # NOTE: ENABLE_PROXY_FIX is ignored here in Airflow 3 — it is read from the
    # [fab] Airflow config (AIRFLOW__FAB__ENABLE_PROXY_FIX in the -config
    # ConfigMap), not from webserver_config.py.
    # Local dev: every SSO user lands as Admin.
    AUTH_USER_REGISTRATION_ROLE = "Admin"

    OAUTH_PROVIDERS = [
        {
            "name": "keycloak",
            "icon": "fa-key",
            "token_key": "access_token",
            "remote_app": {
                "client_id": "airflow",
                "client_secret": os.environ.get("AIRFLOW_OAUTH_CLIENT_SECRET", ""),
                # Discovery over the in-cluster service (plain HTTP); the
                # document's endpoints point to the pinned HTTPS issuer
                # https://keycloak.<domain>:8443, trusted via the mounted
                # capiba-tls CA (SSL_CERT_FILE/REQUESTS_CA_BUNDLE on the
                # airflow container).
                "server_metadata_url": (
                    "http://{{ include "capiba.keycloak.fullname" . }}"
                    ":{{ .Values.keycloak.service.port }}"
                    "/realms/{{ .Values.keycloak.realm }}"
                    "/.well-known/openid-configuration"
                ),
                # FAB fetches userinfo with a relative URL
                # ("openid-connect/userinfo"); authlib only resolves it when
                # api_base_url is set — server metadata discovery doesn't.
                "api_base_url": (
                    "https://keycloak.{{ .Values.ingress.domain }}:8443"
                    "/realms/{{ .Values.keycloak.realm }}/protocol/"
                ),
                "client_kwargs": {"scope": "openid profile email"},
            },
        }
    ]
{{- end }}
