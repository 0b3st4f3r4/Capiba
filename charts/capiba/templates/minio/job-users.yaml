{{- if .Values.minio.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "capiba.minio.fullname" . }}-users
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "minio" "context" .) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "2"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "capiba.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://{{ include "capiba.minio.fullname" . }}:{{ .Values.minio.service.apiPort }}/minio/health/live; do
                echo "Waiting for MinIO..."
                sleep 2
              done
      containers:
        - name: mc
          image: "{{ .Values.minio.mc.image.repository }}:{{ .Values.minio.mc.image.tag }}"
          imagePullPolicy: {{ .Values.minio.mc.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "capiba.minio.fullname" . }}-auth
          command:
            - sh
            - -c
            - |
              set -e
              mc alias set local http://{{ include "capiba.minio.fullname" . }}:{{ .Values.minio.service.apiPort }} "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"

              # Read-write on the lake buckets only (Trino needs writes for
              # dbt marts and Iceberg maintenance: optimize/expire_snapshots).
              cat > /tmp/lake-rw.json <<'EOF'
              {
                "Version": "2012-10-17",
                "Statement": [{
                  "Effect": "Allow",
                  "Action": ["s3:*"],
                  "Resource": [
                    "arn:aws:s3:::capiba-bronze", "arn:aws:s3:::capiba-bronze/*",
                    "arn:aws:s3:::capiba-silver", "arn:aws:s3:::capiba-silver/*",
                    "arn:aws:s3:::capiba-gold", "arn:aws:s3:::capiba-gold/*"
                  ]
                }]
              }
              EOF

              # Read-write on the Airflow logs bucket only.
              cat > /tmp/airflow-logs-rw.json <<'EOF'
              {
                "Version": "2012-10-17",
                "Statement": [{
                  "Effect": "Allow",
                  "Action": ["s3:*"],
                  "Resource": [
                    "arn:aws:s3:::capiba-airflow-logs",
                    "arn:aws:s3:::capiba-airflow-logs/*"
                  ]
                }]
              }
              EOF

              # policy create errors when the policy already exists — keep
              # the first definition (policies are static in the chart).
              mc admin policy create local lake-rw /tmp/lake-rw.json || true
              mc admin policy create local airflow-logs-rw /tmp/airflow-logs-rw.json || true

              # user add upserts the credentials when the user already exists
              mc admin user add local {{ .Values.minio.scopedUsers.trino.accessKey }} {{ .Values.minio.scopedUsers.trino.secretKey }}
              mc admin policy attach local lake-rw --user {{ .Values.minio.scopedUsers.trino.accessKey }} || true
              mc admin user add local {{ .Values.minio.scopedUsers.airflowLogs.accessKey }} {{ .Values.minio.scopedUsers.airflowLogs.secretKey }}
              mc admin policy attach local airflow-logs-rw --user {{ .Values.minio.scopedUsers.airflowLogs.accessKey }} || true
{{- end }}
