{{- if .Values.minio.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capiba.minio.fullname" . }}-auth
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "minio" "context" .) | nindent 4 }}
type: Opaque
stringData:
  MINIO_ROOT_USER: {{ .Values.minio.auth.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.minio.auth.rootPassword | quote }}
  # SSO via Keycloak (realm capiba). The discovery URL uses the in-cluster
  # service (plain HTTP — pods do not trust the ingress self-signed cert);
  # the browser-facing endpoints inside it point to the pinned issuer
  # (http://keycloak.<domain>:8088). Root login stays as fallback.
  MINIO_IDENTITY_OPENID_CONFIG_URL: "http://{{ include "capiba.keycloak.fullname" . }}:{{ .Values.keycloak.service.port }}/realms/{{ .Values.keycloak.realm }}/.well-known/openid-configuration"
  MINIO_IDENTITY_OPENID_CLIENT_ID: minio
  MINIO_IDENTITY_OPENID_CLIENT_SECRET: {{ index .Values.keycloak.clientSecrets "minio" | quote }}
  MINIO_IDENTITY_OPENID_DISPLAY_NAME: "Keycloak (SSO)"
  MINIO_IDENTITY_OPENID_CLAIM_NAME: policy
  MINIO_IDENTITY_OPENID_SCOPES: "openid,profile,email"
  MINIO_IDENTITY_OPENID_REDIRECT_URI: "https://minio.{{ .Values.ingress.domain }}:8443/oauth_callback"
  MINIO_BROWSER_REDIRECT_URL: "https://minio.{{ .Values.ingress.domain }}:8443"
{{- end }}
