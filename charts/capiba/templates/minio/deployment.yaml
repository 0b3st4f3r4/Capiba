{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "capiba.minio.fullname" . }}
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "minio" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.minio.replicaCount }}
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "capiba.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        {{- include "capiba.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      {{- if .Values.keycloak.enabled }}
      initContainers:
        # MinIO fails to initialize OpenID if Keycloak is not ready when it
        # starts, which hides the SSO login button. Wait for the OIDC discovery
        # endpoint before starting the server.
        - name: wait-for-keycloak
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- \
                http://{{ include "capiba.keycloak.fullname" . }}:{{ .Values.keycloak.service.port }}/realms/{{ .Values.keycloak.realm }}/.well-known/openid-configuration > /dev/null 2>&1; do
                echo "Waiting for Keycloak OIDC discovery..."
                sleep 2
              done
      {{- end }}
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          imagePullPolicy: {{ .Values.minio.image.pullPolicy }}
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          env:
            # Trust the self-signed ingress CA (capiba-tls): the OIDC
            # discovery doc (fetched over the plain-HTTP service) advertises
            # the pinned HTTPS issuer endpoints, and MinIO fetches JWKS there.
            - name: SSL_CERT_FILE
              value: /etc/capiba-tls/tls.crt
          envFrom:
            - secretRef:
                name: {{ include "capiba.minio.fullname" . }}-auth
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: capiba-tls-ca
              mountPath: /etc/capiba-tls
              readOnly: true
      volumes:
        - name: capiba-tls-ca
          secret:
            secretName: capiba-tls
            items:
              - key: tls.crt
                path: tls.crt
        - name: data
          {{- if .Values.minio.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "capiba.minio.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
