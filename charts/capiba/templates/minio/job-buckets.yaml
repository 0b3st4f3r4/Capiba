{{- if .Values.minio.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "capiba.minio.fullname" . }}-buckets
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "minio" "context" .) | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "1"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      labels:
        {{- include "capiba.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: minio
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://{{ include "capiba.minio.fullname" . }}:{{ .Values.minio.service.apiPort }}/minio/health/live; do
                echo "Aguardando MinIO..."
                sleep 2
              done
      containers:
        - name: mc
          image: "{{ .Values.minio.mc.image.repository }}:{{ .Values.minio.mc.image.tag }}"
          imagePullPolicy: {{ .Values.minio.mc.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "capiba.minio.fullname" . }}-auth
          volumeMounts:
            - name: cors-config
              mountPath: /tmp/cors
              readOnly: true
          command:
            - sh
            - -c
            - |
              mc alias set local http://{{ include "capiba.minio.fullname" . }}:{{ .Values.minio.service.apiPort }} "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              {{- range .Values.minio.buckets }}
              mc mb -p local/{{ . }}
              # CORS is best-effort: old MinIO releases and newer mc clients can
              # disagree on the CORS XML schema, which would block the upgrade.
              # The Lakekeeper UI needs this for browser-side previews; if it
              # fails here, configure it manually or align the MinIO/mc versions.
              mc cors set local/{{ . }} /tmp/cors/cors.xml || true
              {{- end }}
      volumes:
        - name: cors-config
          configMap:
            name: {{ include "capiba.minio.fullname" . }}-cors
{{- end }}
