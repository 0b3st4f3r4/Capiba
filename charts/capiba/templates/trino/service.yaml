{{- if .Values.trino.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "capiba.trino.fullname" . }}
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "trino" "context" .) | nindent 4 }}
spec:
  type: {{ .Values.trino.service.type }}
  ports:
    - name: http
      port: {{ .Values.trino.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "capiba.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: trino
{{- end }}
