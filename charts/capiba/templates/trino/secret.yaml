{{- if .Values.trino.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capiba.trino.fullname" . }}-auth
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "trino" "context" .) | nindent 4 }}
type: Opaque
stringData:
  # Password file for the local fallback user.  Only honored for requests
  # that reach Trino over a secure channel (the HTTPS ingress) — Trino 483
  # refuses passwords over insecure HTTP.  Format is one
  # ``username:bcrypt-hash`` line (bcrypt cost >= 8 required); generated with
  # ``htpasswd -B -C 10 -n -b``.
  password.db: |
    {{ .Values.trino.auth.internalPasswordHash }}
{{- end }}
