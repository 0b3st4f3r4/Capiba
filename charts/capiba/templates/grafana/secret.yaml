{{- if .Values.grafana.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capiba.grafana.fullname" . }}-secrets
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "grafana" "context" .) | nindent 4 }}
type: Opaque
stringData:
  # Local admin fallback login (SSO via Keycloak is the primary path)
  GF_SECURITY_ADMIN_USER: {{ .Values.grafana.auth.adminUser | quote }}
  GF_SECURITY_ADMIN_PASSWORD: {{ .Values.grafana.auth.adminPassword | quote }}
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {{ index .Values.keycloak.clientSecrets "grafana" | quote }}
{{- end }}
