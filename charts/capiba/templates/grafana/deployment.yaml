{{- if .Values.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "capiba.grafana.fullname" . }}
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "grafana" "context" .) | nindent 4 }}
spec:
  replicas: {{ .Values.grafana.replicaCount }}
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      {{- include "capiba.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "capiba.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      containers:
        - name: grafana
          image: "{{ .Values.grafana.image.repository }}:{{ .Values.grafana.image.tag }}"
          imagePullPolicy: {{ .Values.grafana.image.pullPolicy }}
          env:
            - name: GF_SERVER_ROOT_URL
              value: "https://grafana.{{ .Values.ingress.domain }}:8443"
            - name: GF_INSTALL_PLUGINS
              value: trino-datasource
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            # SSO via Keycloak (generic OAuth). The auth URL is
            # browser-facing (pinned HTTPS issuer on 8443); token and
            # userinfo calls go over the in-cluster service (plain HTTP).
            - name: GF_AUTH_GENERIC_OAUTH_ENABLED
              value: "true"
            - name: GF_AUTH_GENERIC_OAUTH_NAME
              value: "Keycloak"
            - name: GF_AUTH_GENERIC_OAUTH_SCOPES
              value: "openid profile email"
            - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
              value: "https://keycloak.{{ .Values.ingress.domain }}:8443/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/auth"
            - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
              value: "http://{{ include "capiba.keycloak.fullname" . }}:{{ .Values.keycloak.service.port }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/token"
            - name: GF_AUTH_GENERIC_OAUTH_API_URL
              value: "http://{{ include "capiba.keycloak.fullname" . }}:{{ .Values.keycloak.service.port }}/realms/{{ .Values.keycloak.realm }}/protocol/openid-connect/userinfo"
            - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
              value: "true"
            # Local dev: every SSO user gets Admin (JMESPath literal).
            - name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH
              value: "'Admin'"
          envFrom:
            - secretRef:
                name: {{ include "capiba.grafana.fullname" . }}-secrets
          ports:
            - name: http
              containerPort: {{ .Values.grafana.service.port }}
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.grafana.resources | nindent 12 }}
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning
              readOnly: true
            # Dashboards as code: *.json of charts/capiba/dashboards/
            # mounted for the file provider (see the provisioning
            # ConfigMap).
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: provisioning
          configMap:
            name: {{ include "capiba.grafana.fullname" . }}-provisioning
            items:
              - key: datasources.yaml
                path: datasources/datasources.yaml
              - key: dashboards.yaml
                path: dashboards/dashboards.yaml
        - name: dashboards
          configMap:
            name: {{ include "capiba.grafana.fullname" . }}-dashboards
{{- end }}
