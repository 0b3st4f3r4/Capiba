{{- if .Values.kepler.enabled }}
# Minimal RBAC: Kepler v0.11 discovers pods polling the kubelet /pods
# endpoint (nodes/proxy) and lists pods/nodes for the pod metadata.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "capiba.kepler.fullname" . }}
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "kepler" "context" .) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "capiba.kepler.fullname" . }}
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "kepler" "context" .) | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - nodes
    verbs:
      - get
      - list
      - watch
  # Required for kubelet /pods endpoint access (kubelet uses webhook authorization)
  - apiGroups:
      - ""
    resources:
      - nodes/proxy
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "capiba.kepler.fullname" . }}
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "kepler" "context" .) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "capiba.kepler.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "capiba.kepler.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
