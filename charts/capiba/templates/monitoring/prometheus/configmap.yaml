{{- if .Values.prometheus.enabled }}
# Scrape configuration. The k3s kubelet serves HTTPS on 10250 with a
# self-signed cert, so the node-role jobs authenticate with the
# ServiceAccount bearer token and skip TLS verification (dev cluster).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "capiba.prometheus.fullname" . }}-config
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "prometheus" "context" .) | nindent 4 }}
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

      # k3s kubelet metrics (kubelet_volume_*, etc.)
      - job_name: kubelet
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node

      # cAdvisor: container_cpu_usage_seconds_total,
      # container_memory_working_set_bytes, machine_memory_bytes.
      - job_name: cadvisor
        metrics_path: /metrics/cadvisor
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          insecure_skip_verify: true
        kubernetes_sd_configs:
          - role: node

      {{- if .Values.kepler.enabled }}
      # Kepler DaemonSet pods (energy/power estimation per pod).
      - job_name: kepler
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app_kubernetes_io_component
              - __meta_kubernetes_pod_phase
            separator: ";"
            regex: "kepler;Running"
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:{{ .Values.kepler.service.port }}
      {{- end }}
{{- end }}
