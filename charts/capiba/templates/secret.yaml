{{- if .Values.api.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capiba.fullname" . }}-secrets
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
type: Opaque
stringData:
  # MinIO
  MINIO_ACCESS_KEY: {{ .Values.minio.auth.rootUser | quote }}
  MINIO_SECRET_KEY: {{ .Values.minio.auth.rootPassword | quote }}
  # Scoped MinIO user for Trino (lake buckets only — see minio/job-users.yaml)
  TRINO_MINIO_ACCESS_KEY: {{ .Values.minio.scopedUsers.trino.accessKey | quote }}
  TRINO_MINIO_SECRET_KEY: {{ .Values.minio.scopedUsers.trino.secretKey | quote }}
  # PostgreSQL credentials of the Trino `dwh` catalog (complementary data
  # warehouse — database/user created by postgres/job-dwh.yaml)
  TRINO_POSTGRES_USER: {{ .Values.postgresql.dwh.username | quote }}
  TRINO_POSTGRES_PASSWORD: {{ .Values.postgresql.dwh.password | quote }}

  # ArangoDB
  ARANGODB_ROOT_PASSWORD: {{ .Values.arangodb.auth.rootPassword | quote }}

  # Public APIs
  TRANSPARENCY_API_KEY: {{ .Values.global.transparencyApiKey | default "" | quote }}

  # Notification
  NOTIFICATION_EMAIL_USER: ""
  NOTIFICATION_EMAIL_PASSWORD: ""

  # SSO (Keycloak) — portal capiba-dashboard
  KEYCLOAK_CLIENT_ID: "capiba-dashboard"
  KEYCLOAK_CLIENT_SECRET: {{ index .Values.keycloak.clientSecrets "capiba-dashboard" | quote }}
  PORTAL_SESSION_SECRET: {{ .Values.api.portalSessionSecret | quote }}

  # Trino Web UI SSO (Keycloak OIDC) + internal password fallback
  TRINO_OAUTH2_CLIENT_ID: "trino"
  TRINO_OAUTH2_CLIENT_SECRET: {{ index .Values.keycloak.clientSecrets "trino" | quote }}
  TRINO_INTERNAL_SHARED_SECRET: {{ .Values.trino.auth.internalSharedSecret | quote }}
  TRINO_PASSWORD: {{ .Values.trino.auth.internalPassword | quote }}

  # Lakekeeper machine credentials (Keycloak client capiba-services): Trino
  # (rest-catalog oauth2) and pyiceberg when the catalog requires auth
  ICEBERG_OAUTH2_CREDENTIAL: {{ printf "capiba-services:%s" (index .Values.keycloak.clientSecrets "capiba-services") | quote }}
  ICEBERG_OAUTH2_CLIENT_ID: "capiba-services"
  ICEBERG_OAUTH2_CLIENT_SECRET: {{ index .Values.keycloak.clientSecrets "capiba-services" | quote }}
{{- end }}
