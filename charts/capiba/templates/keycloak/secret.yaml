{{- if .Values.keycloak.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capiba.keycloak.fullname" . }}-secrets
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "keycloak" "context" .) | nindent 4 }}
type: Opaque
stringData:
  KC_DB_USERNAME: {{ .Values.keycloak.database.username | quote }}
  KC_DB_PASSWORD: {{ .Values.keycloak.database.password | quote }}
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.keycloak.admin.username | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.keycloak.admin.password | quote }}
{{- end }}
