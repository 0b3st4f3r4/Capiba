{{- if .Values.marquez.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "capiba.marquez.fullname" . }}-config
  labels:
    {{- include "capiba.labels" . | nindent 4 }}
    {{- include "capiba.componentLabels" (dict "component" "marquez" "context" .) | nindent 4 }}
data:
  # Production config for the Marquez API. The image's bundled
  # marquez.dev.yml hardcodes user/password "marquez" and enables the
  # OpenSearch integration — this file parameterizes the DB credentials
  # (from the marquez-secrets Secret) and disables search.
  marquez.yml: |
    server:
      applicationConnectors:
      - type: http
        port: ${MARQUEZ_PORT:-5000}
        httpCompliance: RFC7230_LEGACY
      adminConnectors:
      - type: http
        port: ${MARQUEZ_ADMIN_PORT:-5001}

    db:
      driverClass: org.postgresql.Driver
      url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}

    migrateOnStartup: true

    graphql:
      enabled: true

    logging:
      level: INFO
      appenders:
        - type: console

    search:
      enabled: false

    tags:
      - name: PII
        description: Personally identifiable information
      - name: SENSITIVE
        description: Contains sensitive information
{{- end }}
