name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Check import order (isort)
        run: isort --check-only --diff src/ tests/ scripts/

      - name: Lint (ruff)
        run: ruff check

      - name: Typecheck
        run: make typecheck

      - name: Tests (pytest)
        # Integration tests are skipped by default (require CAPIBA_INTEGRATION=1);
        # slow regime tests (detection batteries) are enabled here explicitly so
        # the pre-registered anchors are always verified in CI.
        # Coverage floor (fail_under = 85) is enforced via pyproject.toml.
        run: CAPIBA_SLOW=1 pytest tests/ --cov=src/capiba --cov-report=term-missing

      - name: Security (bandit)
        run: bandit -r src/
